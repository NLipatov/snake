<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#101610">
    <meta
      name="description"
      content="Play a classic Snake game online with keyboard and touch controls. Guide the snake, collect food, and chase your highest score."
    >
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Snake">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://snake.ethacore.com/">
    <meta property="og:site_name" content="Snake">
    <meta property="og:locale" content="en_US">
    <meta property="og:title" content="Play Classic Snake Game Online">
    <meta
      property="og:description"
      content="Play a classic Snake game online with keyboard and touch controls. Guide the snake, collect food, and chase your highest score."
    >
    <meta property="og:image" content="https://snake.ethacore.com/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Classic Snake game preview">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Play Classic Snake Game Online">
    <meta
      name="twitter:description"
      content="Play a classic Snake game online with keyboard and touch controls. Guide the snake, collect food, and chase your highest score."
    >
    <meta name="twitter:image" content="https://snake.ethacore.com/og-image.png">
    <meta name="twitter:image:alt" content="Classic Snake game preview">
    <title>Play Classic Snake Game Online</title>
    <link rel="canonical" href="https://snake.ethacore.com/">
    <link rel="icon" type="image/svg+xml" href="./snake-icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./style.css">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Play Classic Snake Game Online",
        "url": "https://snake.ethacore.com/",
        "description": "Play a classic Snake game online with keyboard and touch controls. Guide the snake, collect food, and chase your highest score.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and WebAssembly support.",
        "isAccessibleForFree": true,
        "image": "https://snake.ethacore.com/og-image.png",
        "offers": {
          "@type": "Offer",
          "price": 0,
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Person",
          "name": "NLipatov"
        }
      }
    </script>
  </head>
  <body>
    <main class="app-shell">
      <h1 class="sr-only">Play Classic Snake Game Online</h1>
      <p class="sr-only">
        Play a classic Snake game in your browser. Use arrow keys on desktop or touch controls on mobile.
      </p>
      <section class="game-panel">
        <header class="panel-top">
          <div class="scoreboard">
            <span class="score-label">Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="controls">
            <button
              id="pause-button"
              class="icon-button"
              type="button"
              aria-label="Pause game"
              aria-pressed="false"
              title="Pause"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="6" y="4.5" width="4.5" height="15" rx="1.2" fill="currentColor"></rect>
                <rect x="13.5" y="4.5" width="4.5" height="15" rx="1.2" fill="currentColor"></rect>
              </svg>
            </button>
            <button id="restart-button" class="icon-button" type="button" aria-label="Restart game" title="Restart">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  d="M19.25 11.75a7.25 7.25 0 1 1-2.2-5.2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                ></path>
                <path
                  d="M19.25 5v5.15H14.1"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
            </button>
          </div>
        </header>

        <div class="canvas-frame">
          <canvas id="board" aria-label="Snake board"></canvas>
          <div id="overlay" class="overlay hidden" aria-live="polite"></div>
        </div>

        <section class="touch-controls" aria-label="Touch controls">
          <div class="dpad">
            <button class="dpad-button up" data-direction="up" type="button" aria-label="Move up">↑</button>
            <button class="dpad-button left" data-direction="left" type="button" aria-label="Move left">←</button>
            <div class="dpad-core" aria-hidden="true"></div>
            <button class="dpad-button right" data-direction="right" type="button" aria-label="Move right">→</button>
            <button class="dpad-button down" data-direction="down" type="button" aria-label="Move down">↓</button>
          </div>
        </section>

        <footer class="panel-footer">
          <span id="status">Use arrow keys to play.</span>
          <span class="desktop-hint">Space pauses. Esc restarts.</span>
        </footer>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
