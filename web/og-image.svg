<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Play Classic Snake Game Online</title>
  <desc id="desc">Preview image for a classic Snake game with an LCD-style board.</desc>
  <defs>
    <pattern id="lcd-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#132013"/>
      <rect x="1" y="1" width="16" height="16" fill="#1f311f"/>
    </pattern>
    <pattern id="scanlines" width="1" height="6" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="lcd-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#6ef0a3" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#101610"/>
  <rect x="76" y="68" width="1048" height="494" rx="30" fill="#d7d0bd" stroke="#9a927e" stroke-width="3" filter="url(#soft-shadow)"/>

  <g transform="translate(120 150)">
    <rect width="536" height="330" fill="#263127" stroke="#161b14" stroke-width="6"/>
    <rect x="24" y="24" width="488" height="282" fill="url(#lcd-grid)"/>
    <rect x="24" y="24" width="488" height="282" fill="url(#scanlines)" opacity="0.18"/>
    <rect x="24" y="24" width="488" height="282" fill="none" stroke="#8e948c" stroke-width="8"/>

    <rect x="128" y="116" width="30" height="30" rx="5" fill="#6ef0a3"/>
    <rect x="162" y="116" width="30" height="30" rx="5" fill="#6ef0a3"/>
    <rect x="196" y="116" width="30" height="30" rx="5" fill="#6ef0a3"/>
    <rect x="230" y="116" width="30" height="30" rx="5" fill="#6ef0a3"/>
    <rect x="264" y="116" width="30" height="30" rx="5" fill="#6ef0a3"/>
    <rect x="298" y="116" width="30" height="30" rx="5" fill="#a3ffd6" filter="url(#lcd-glow)"/>
    <rect x="376" y="184" width="30" height="30" fill="#ff7f52"/>
  </g>

  <g transform="translate(718 268)">
    <text x="0" y="0" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="86" font-weight="700" fill="#1f241d">Snake</text>
    <text x="4" y="74" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="30" letter-spacing="1.2" fill="#54604d">CLASSIC GAME ONLINE</text>
  </g>
</svg>
